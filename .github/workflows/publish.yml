name: Publish GHCR image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select version
        id: version
        shell: bash
        run: |
          value="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            value="manual-${GITHUB_RUN_NUMBER}"
          fi
          printf 'value=%s\n' "${value}" >> "${GITHUB_OUTPUT}"

      - name: Verify Compose profile
        shell: bash
        run: |
          GHCR_OWNER="${GITHUB_REPOSITORY_OWNER}" \
            GLIMMER_TAG="${{ steps.version.outputs.value }}" \
            API_KEY=release-workflow-placeholder \
            docker compose config > /tmp/glimmer-compose.yaml
          grep -Fq 'release-workflow-placeholder' /tmp/glimmer-compose.yaml
          grep -Fq "glimmer-b70-vllm:${{ steps.version.outputs.value }}" \
            /tmp/glimmer-compose.yaml

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.b3-glimmer-one
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/glimmer-b70-vllm:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/glimmer-b70-vllm:latest
          provenance: false
          sbom: false

      - name: Verify anonymous pull
        shell: bash
        run: |
          scope="repository:${GITHUB_REPOSITORY_OWNER}/glimmer-b70-vllm:pull"
          token=$(curl -fsS "https://ghcr.io/token?scope=${scope}" | jq -r .token)
          test -n "${token}"
          curl -fsS \
            -o /dev/null \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${GITHUB_REPOSITORY_OWNER}/glimmer-b70-vllm/manifests/${{ steps.version.outputs.value }}"
